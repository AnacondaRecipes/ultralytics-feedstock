{% set name = "ultralytics" %}
{% set version = "8.4.137" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6928c498878f6288e750d0e0acde32d46bad5afdea924391a995d41e296eb150

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - yolo = ultralytics.cfg:entrypoint
    - ultralytics = ultralytics.cfg:entrypoint
  # Drop py3.14 for now since tensorflow is not available for it
  skip: true  # [py<38 or py>313]

requirements:
  host:
    - python
    - pip
    - setuptools >=70.0.0,<=84.0.0
    - wheel
  run:
    - python
    - filelock >=3.16.1
    - numpy >=1.23
    - matplotlib-base >=3.3.0
    - opencv >=4.7.0,!=4.13.0.90
    - pillow >=7.1.2
    - pyyaml >=5.3.1
    - requests >=2.23.0
    - pytorch >=1.8.0  # [unix]
    - pytorch >=1.8.0,!=2.4.0  # [win]
    - torchvision >=0.9.0
    - psutil >=5.8.0
    - polars >=0.20.0
    - nvidia-ml-py >=12.0.0
    - ultralytics-thop >=2.1.6
    - ultralytics-platform >=0.1.3  # [py>=311]
    # https://github.com/ultralytics/ultralytics/blob/88b030173dbbaff2f22925faffd0cb780500c1a9/ultralytics/utils/ops.py#L768
    - scipy >=1.4.1
  run_constrained:
    # export-base
    # No numpy <2.0.0 for Python 3.13
    - numpy <2.0.0  # [py<313]
    - onnx >=1.12.0  # [not osx]
    - onnx >=1.12.0,<1.18.0  # [osx]
    - onnxslim >=0.1.82
    - onnxruntime <1.20.0  # [(win or (osx and arm64)) and py<311]
    - onnxruntime >=1.20.0  # [py>=311]
    - nncf >=2.14.0,<3.0.0  # [py>=39]
    - openvino >=2024.0.0
    - packaging >=26.0  # [linux and aarch64 and py>=39]
    # export-tensorflow
     # Remove tensorflow upper bound to avoid solver failures between tensorflow/pytorch/torchvision
    - tensorflow >=2.0.0,<=2.19.0  # [py<313]
    - tensorflowjs >2.19.0,<3.0.0  # [py<313]
    - ydf <0.13.0  # [not aarch64 and py<=312]
    - googleapis-common-protos <1.74.0  # [py<=312]
    - tensorstore >=0.1.63  # [aarch64 and py>=39]
    - h5py !=3.11.0  # [aarch64]
    # export-coreai
    - coreai-torch >=0.4.2  # [osx and arm64 and py>=3.11 and py<3.14]
    # export-coreml
    - coremltools >=9.0  # [not win and py<=313]
    - scikit-learn >=1.3.2  # [not win and py<=313]
    # export-executorch
    - torch >=2.12.0,<2.13.0  #[linux and aarch64]
    # export-litert
    - litert-torch >=0.9.0  # [(linux and x86_64) or osx]
    - ai-edge-litert >=2.1.4  # [(linux and x86_64) or osx]
    - ai-edge-quantizer >=0.6.0  # [(linux and x86_64) or osx]
    # solutions
    - shapely >=2.0.0
    - lap>=0.5.12
    - streamlit >=1.51.0  # [py>=310]
    - streamlit >=1.29.0,<1.51.0  # [py<310 and (aarch64 or not linux)]
    - flask >=3.0.1
    # llm
    - openai >=2.0.0
    # extra
    - albumentations >=1.4.6
    - faster-coco-eval >=1.6.7


# Failing only on CI, requires GUI/display (SIGABRT when no screen: "Cannot create window: no screens available").
# [LINUX64 PY313]:
# E   AttributeError: module 'tensorflow._api.v2.compat.v2.__internal__' has no attribute 'register_load_context_function'. Did you mean: 'register_call_context_function'?
# Upstream tests are automatically installing tf_keras-2.15.0 which is not compatible with tensorflow-2.20.0.
# https://github.com/keras-team/tf-keras/issues/257
# This issue can be fixed by pinning tf-keras to test environment but tf_keras<=2.19.0 is not available for Python 3.13 on the main channel
# Upstream requirement: https://github.com/ultralytics/ultralytics/blob/v8.4.19/ultralytics/engine/exporter.py#L1062
# [LINUX-AARCH64 ALL PYTHONS]:
# E ImportError: /lib64/libm.so.6: version `GLIBC_2.29' not found
# [LINUX-AARCH64 PY312/PY313]:
# openvivo is not available on main channel
# Upstream test env tries to install it during test execution using pip but openvivo is not available for linux-aarch64 py>=312
# This is why those tests are working on other platforms and pythons.
# Ultralytics requirement ['openvino>=2024.0.0'] not found, attempting AutoUpdate...
# WARNING requirements: Command 'pip install --no-cache-dir "openvino>=2024.0.0" ' returned non-zero exit status 1.
# ERROR: Could not find a version that satisfies the requirement openvino>=2024.0.0 (from versions: none)
# ERROR: No matching distribution found for openvino>=2024.0.0
# Fatal Python error: Aborted
# File ".../MNN/tools/mnnquant.py", line 8 in <module>
#  ← importing _mnncengine (listed last in Extension modules)
# mnn is an optional export format, skip test:
# E   FileNotFoundError: [Errno 2] No such file or directory: '/private/var/folders/bf/zv4tnz9n509d_vvdxt3l9w8c0000gn/T/pytest-of-ec2-user/pytest-9/test_export_ncnn0/yolo26n_ncnn_model/model_pnnx.py'
{% set deselect_tests = "" %}
{% set deselect_tests = 'deselect_tests + " --deselect=tests/test_python.py::test_utils_checks"' %}  # [osx]
{% set deselect_tests = deselect_tests + " --deselect=tests/test_solutions.py" %}  # [osx]
{% set deselect_tests = 'deselect_tests + " --deselect=tests/test_cli.py::test_solutions"' %}  # [osx]
{% set deselect_tests = 'deselect_tests + " --deselect=tests/test_exports.py::test_export_tflite"' %}  # [(linux64 and py>=313) or aarch64]
{% set deselect_tests = 'deselect_tests + " --deselect=tests/test_exports.py::test_export_openvino"' %}  # [linux]
{% set deselect_tests = 'deselect_tests + " --deselect=tests/test_exports.py::test_export_mnn"' %}  # [linux]
{% set deselect_tests = 'deselect_tests + " --deselect=tests/test_exports.py::test_export_ncnn"' %}  # [osx]

test:
  source_files:
    - tests
  imports:
    - ultralytics
    - ultralytics.cfg
    - ultralytics.data
    - ultralytics.data.annotator
    - ultralytics.data.augment
    - ultralytics.data.build
    - ultralytics.data.converter
    - ultralytics.data.dataset
    - ultralytics.data.loaders
    - ultralytics.data.split
    - ultralytics.data.utils
    - ultralytics.engine.exporter
    - ultralytics.engine.model
    - ultralytics.engine.predictor
    - ultralytics.engine.results
    - ultralytics.engine.trainer
    - ultralytics.engine.validator
    - ultralytics.models
    - ultralytics.models.sam.modules.blocks
    - ultralytics.models.sam.modules.utils
    - ultralytics.models.yolo
    - ultralytics.models.yolo.classify.predict
    - ultralytics.models.yolo.classify.train
    - ultralytics.models.yolo.classify.val
    - ultralytics.models.yolo.detect
    - ultralytics.models.yolo.detect.predict
    - ultralytics.models.yolo.segment
    - ultralytics.models.yolo.world
    - ultralytics.models.yolo.world.train_world
    - ultralytics.nn.autobackend
    - ultralytics.nn.modules
    - ultralytics.nn.modules.head
    - ultralytics.nn.modules.transformer
    - ultralytics.nn.modules.utils
    - ultralytics.nn.tasks
    - ultralytics.optim
    - ultralytics.solutions.config
    - ultralytics.solutions.object_counter
    - ultralytics.solutions.solutions
    - ultralytics.trackers
    - ultralytics.trackers.utils
    - ultralytics.utils
    - ultralytics.utils.export
    - ultralytics.utils.callbacks
  requires:
    - pip
    - pytest
    - git
    - tensorflow
    # https://github.com/AnacondaRecipes/torchvision-feedstock/blob/master/recipe/meta.yaml#L8
    - pytorch-cpu 2.7
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # Unit tests after positive run just hanging on results prompt on osx.
    - pytest -vv tests {{ deselect_tests }}  # [not (osx and py>=313)]
    - yolo checks
    - ultralytics version

about:
  home: https://www.ultralytics.com/
  summary: Ultralytics YOLO for SOTA object detection, multi-object tracking, instance segmentation, pose estimation and image classification.
  license: AGPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  description: |
    Ultralytics creates cutting-edge, state-of-the-art (SOTA) YOLO models built on years of
    foundational research in computer vision and AI. Constantly updated for performance and
    flexibility, our models are fast, accurate, and easy to use. They excel at object detection, tracking,
    instance segmentation, image classification, and pose estimation tasks.
  doc_url: https://docs.ultralytics.com
  dev_url: https://github.com/ultralytics/ultralytics

extra:
  recipe-maintainers:
    - onuralpszr
    - UltralyticsAssistant
    - glenn-jocher
    - Laughing-q
    - pderrenger
